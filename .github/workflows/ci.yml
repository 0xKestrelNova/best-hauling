name: CI (tests)

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # actions/checkout écrit sinon le GITHUB_TOKEN en clair dans .git/config du workspace,
          # là même où tournent ensuite du code de test et des dépendances tierces. Ce job ne
          # pousse rien : il n'a aucun besoin de ce token.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          # 24 et non 20 depuis que logic est en TypeScript : Node efface les annotations de type à
          # l'exécution, SANS FLAG à partir de la 23 (la 22 l'exige encore). C'est ce qui permet à ce
          # job de garder sa propriété — il n'installe toujours RIEN, pas de transpileur, pas de
          # cache npm — et à `node --test` d'importer logic.ts tel quel.
          # Attention : l'effacement de types ne VÉRIFIE rien, il retire. C'est le job `types`
          # ci-dessous qui dit si les annotations sont vraies.
          node-version: 24
      - name: Tests unitaires (fonctions pures)
        run: node --test

  # Vérification des types, dans son propre job : `node --test` passerait au vert sur des
  # annotations FAUSSES, puisqu'il les efface sans les lire. Séparé de `unit` pour que le signal
  # reste lisible — « les types ne collent pas » n'est pas « un test échoue » — et parce que ce job,
  # lui, doit installer TypeScript.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: npm
      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund
      - name: Vérification des types
        run: npm run typecheck

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # actions/checkout écrit sinon le GITHUB_TOKEN en clair dans .git/config du workspace,
          # là même où tournent ensuite du code de test et des dépendances tierces. Ce job ne
          # pousse rien : il n'a aucun besoin de ce token.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          # Cache du registre npm (~/.npm), clé sur package-lock.json. Le job `unit` n'installe
          # toujours rien — il lance `node --test` sur des modules sans dépendance, TypeScript
          # compris depuis que Node efface les types lui-même — donc il n'en a pas besoin. Le job
          # `types`, lui, installe, et porte donc son propre cache.
          cache: npm
      # Le navigateur pèse plus lourd que les dépendances : sans cache, chaque run le retélécharge
      # et le job passait ~3 min. La clé porte le lockfile, donc un bump de Playwright invalide le
      # cache — un binaire d'une autre version ne peut pas être servi à la place.
      - name: Cache du navigateur Playwright
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      # `npm install` ne vérifie pas que package-lock.json est en phase avec package.json : quand il
      # ne l'est plus — un bump de plage oublié dans une PR, par exemple — il résout un arbre neuf,
      # ignore les hashes d'intégrité verrouillés et réécrit le lock dans le runner, en exécutant au
      # passage les scripts postinstall de versions que personne n'a relues. Le job passe au vert et
      # le badge CI atteste d'un arbre que rien n'a validé. `npm ci` échoue bruyamment à la place.
      - name: Installer les dépendances de test
        run: npm ci --no-audit --no-fund
      # Deux étapes exclusives, et non une seule avec `--with-deps` : le cache ne porte QUE le
      # binaire du navigateur (~/.cache/ms-playwright). Les paquets système dont Chromium dépend
      # vivent dans l'image du runner, hors du cache, et manqueraient donc sur un succès de cache.
      - name: Installer le navigateur Playwright (cache manqué)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Installer les dépendances système du navigateur (cache touché)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Tests E2E de fumée
        run: npx playwright test

      # `test-results/` (trace du retry, snapshot ARIA) et `playwright-report/` sont gitignorés et
      # meurent avec le runner : sans téléversement, un échec CI ne laisse que la sortie texte du
      # reporter `list`. On ne téléverse que sur échec — un job vert n'a rien à archiver.
      - name: Traces Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7
